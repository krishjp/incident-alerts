[project]
name = "incident-alerts-backend"
version = "0.1.0"
description = "Real-time traffic incident notification backend worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "urllib3>=2.0.0",
    "geopy>=2.4.0",
    "polyline>=2.0.0",
    "google-genai>=1.0.0",
    "twilio>=9.0.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "anyio>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: mark test as requiring live web access/scraping",
    "slow: mark test as long-running / slow",
    "network: mark test as requiring external internet connectivity",
]
